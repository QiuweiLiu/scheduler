<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="700" viewBox="0 0 1560 700">
  <defs>
    <marker id="af" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6672"/>
    </marker>
    <marker id="au" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a97a6"/>
    </marker>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,4 L8,8 z" fill="#8a97a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1560" height="700" fill="white"/>

  <text x="110" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8a97a6">time →</text>
  <text x="30" y="225" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5a6672" text-anchor="start">GPU 0</text>
  <text x="30" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5a6672" text-anchor="start">GPU 1</text>

  <!-- ================= GPU 0 链 ================= -->

  <!-- 1 派发 -->
  <rect x="110" y="180" width="155" height="80" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="187" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#c98a2e" text-anchor="middle">Scheduler: dispatch J1</text>
  <text x="187" y="235" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">(start execution)</text>
  <line x1="265" y1="220" x2="287" y2="220" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 2 J1 规划 -->
  <rect x="289" y="180" width="155" height="80" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="366" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#2b5d8a" text-anchor="middle">J1·plan 8B</text>
  <text x="366" y="235" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">(arrives 0s)</text>
  <line x1="444" y1="220" x2="466" y2="220" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 3 J1 空间 -->
  <rect x="468" y="180" width="155" height="80" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="545" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#2b5d8a" text-anchor="middle">J1·spatial 8B</text>
  <line x1="623" y1="220" x2="645" y2="220" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 4 J1 回答 -->
  <rect x="647" y="180" width="155" height="80" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="724" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#2b5d8a" text-anchor="middle">J1·answer 8B</text>
  <line x1="802" y1="220" x2="824" y2="220" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 5 驱逐+加载 -->
  <rect x="826" y="180" width="155" height="80" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="903" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#c98a2e" text-anchor="middle">Scheduler: evict 8B</text>
  <text x="903" y="232" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#c98a2e" text-anchor="middle">load 4B</text>
  <text x="903" y="250" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">(wait 4 s)</text>
  <line x1="981" y1="220" x2="1003" y2="220" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 6 J4 规划 -->
  <rect x="1005" y="180" width="155" height="80" rx="9" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.6"/>
  <text x="1082" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#2f8f83" text-anchor="middle">J4·plan 4B</text>
  <text x="1082" y="235" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">(arrives 60.5s)</text>
  <line x1="1160" y1="220" x2="1182" y2="220" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 7 J5 规划 -->
  <rect x="1184" y="180" width="155" height="80" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="1261" y="213" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#2b5d8a" text-anchor="middle">J5·plan 8B</text>
  <text x="1261" y="235" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">(arrives 66.5s)</text>
  <line x1="1339" y1="220" x2="1361" y2="220" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 8 J5 空间 -->
  <rect x="1363" y="180" width="155" height="80" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="1440" y="225" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#2b5d8a" text-anchor="middle">J5·spatial 8B</text>

  <!-- ================= GPU 1 链 ================= -->

  <!-- 1 派发 -->
  <rect x="110" y="430" width="155" height="80" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="187" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#c98a2e" text-anchor="middle">Scheduler: dispatch J2</text>
  <text x="187" y="485" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">(start execution)</text>
  <line x1="265" y1="470" x2="287" y2="470" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 2 J2 规划 -->
  <rect x="289" y="430" width="155" height="80" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="366" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#2b5d8a" text-anchor="middle">J2·plan 8B</text>
  <text x="366" y="485" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">(arrives 24s)</text>
  <line x1="444" y1="470" x2="466" y2="470" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 3 J2 空间 -->
  <rect x="468" y="430" width="155" height="80" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="545" y="475" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#2b5d8a" text-anchor="middle">J2·spatial 8B</text>
  <line x1="623" y1="470" x2="645" y2="470" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 4 J2 回答 -->
  <rect x="647" y="430" width="155" height="80" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="724" y="475" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#2b5d8a" text-anchor="middle">J2·answer 8B</text>
  <line x1="802" y1="470" x2="824" y2="470" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 5 J3 规划 -->
  <rect x="826" y="430" width="155" height="80" rx="9" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.6"/>
  <text x="903" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#2f8f83" text-anchor="middle">J3·plan 4B</text>
  <text x="903" y="485" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">(arrives 60.5s)</text>
  <line x1="981" y1="470" x2="1003" y2="470" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 6 J4 规划(共置) -->
  <rect x="1005" y="430" width="155" height="80" rx="9" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.6"/>
  <text x="1082" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#2f8f83" text-anchor="middle">J4·plan 4B</text>
  <text x="1082" y="485" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">(co-located with J3)</text>
  <line x1="1160" y1="470" x2="1182" y2="470" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 7 预取 -->
  <rect x="1184" y="430" width="155" height="80" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="1261" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#c98a2e" text-anchor="middle">Scheduler: prefetch 3B</text>
  <text x="1261" y="485" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">(idle window · 3.9s)</text>
  <line x1="1339" y1="470" x2="1361" y2="470" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <!-- 8 回答 3B -->
  <rect x="1363" y="430" width="155" height="80" rx="9" fill="#f0ecf7" stroke="#7d6aa8" stroke-width="1.6"/>
  <text x="1440" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#7d6aa8" text-anchor="middle">J3/J4·answer 3B</text>
  <text x="1440" y="485" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#6b6b6b" text-anchor="middle">(no wait)</text>

  <!-- ================= 并行连接(双向箭头) ================= -->

  <line x1="480" y1="268" x2="480" y2="422" stroke="#8a97a6" stroke-width="1.6" marker-start="url(#au)" marker-end="url(#ad)"/>
  <text x="492" y="330" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5a6672">24-49 s · both GPUs busy</text>
  <text x="492" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#2b5d8a">8B ‖ 8B (J1 ‖ J2)</text>

  <line x1="905" y1="268" x2="905" y2="422" stroke="#8a97a6" stroke-width="1.6" marker-start="url(#au)" marker-end="url(#ad)"/>
  <text x="917" y="330" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5a6672">61-79 s · both GPUs busy</text>
  <text x="917" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#2f8f83">4B ‖ 4B (J4 ‖ J3)</text>

  <line x1="1280" y1="268" x2="1280" y2="422" stroke="#8a97a6" stroke-width="1.6" marker-start="url(#au)" marker-end="url(#ad)"/>
  <text x="1292" y="330" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5a6672">79-126 s · different models</text>
  <text x="1292" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#7d6aa8">8B ‖ 4B→3B (J5 ‖ J3/J4)</text>

  <!-- ================= 图例 ================= -->

  <rect x="110" y="596" width="14" height="14" rx="3" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.4"/>
  <text x="132" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a6672">model 8B</text>
  <rect x="230" y="596" width="14" height="14" rx="3" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.4"/>
  <text x="252" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a6672">model 4B</text>
  <rect x="350" y="596" width="14" height="14" rx="3" fill="#f0ecf7" stroke="#7d6aa8" stroke-width="1.4"/>
  <text x="372" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a6672">model 3B</text>
  <rect x="470" y="596" width="14" height="14" rx="3" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.4"/>
  <text x="492" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a6672">Scheduler actions (dispatch / evict / load / prefetch)</text>
  <line x1="800" y1="603" x2="830" y2="603" stroke="#8a97a6" stroke-width="1.6" marker-start="url(#au)" marker-end="url(#ad)"/>
  <text x="840" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a6672">parallel span (both GPUs busy)</text>

  <text x="110" y="650" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8a97a6">Example from a real simulation trace (validation_000013); each row = one GPU's execution sequence; the two rows advance together = parallel scheduling</text>
</svg>
