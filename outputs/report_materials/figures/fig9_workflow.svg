<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <marker id="af" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6672"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="white"/>

  <!-- ===== 主链:输入 → 规划 → 回答 → 答案 ===== -->

  <!-- 输入(灰族:数据) -->
  <rect x="40" y="80" width="200" height="100" rx="10" fill="#f0f2f5" stroke="#8a97a6" stroke-width="2"/>
  <text x="140" y="122" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5a6672" text-anchor="middle">Video + Question</text>
  <text x="140" y="148" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">(workflow input)</text>

  <line x1="240" y1="130" x2="308" y2="130" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>

  <!-- 规划器(蓝族:GPU 模型) -->
  <rect x="310" y="65" width="300" height="130" rx="12" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="2"/>
  <text x="460" y="108" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">Planner</text>
  <text x="460" y="134" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">8B / 4B vision-language model · GPU</text>
  <text x="460" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">median step ~5.0 s</text>

  <line x1="610" y1="130" x2="678" y2="130" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>

  <!-- Answer generation(蓝族) -->
  <rect x="680" y="65" width="280" height="130" rx="12" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="2"/>
  <text x="820" y="108" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">Answer generation</text>
  <text x="820" y="134" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">8B / 3B vision-language model · GPU</text>
  <text x="820" y="156" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">median ~0.25 s</text>

  <line x1="960" y1="130" x2="1028" y2="130" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>

  <!-- 答案(灰族) -->
  <rect x="1030" y="80" width="130" height="100" rx="10" fill="#f0f2f5" stroke="#8a97a6" stroke-width="2"/>
  <text x="1095" y="135" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#5a6672" text-anchor="middle">Answer</text>

  <!-- ===== ReAct 循环(规划器 ⇄ 工具) ===== -->

  <line x1="420" y1="195" x2="420" y2="258" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>
  <text x="408" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="end">tool call</text>

  <line x1="520" y1="258" x2="520" y2="195" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>
  <text x="532" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="start">observation</text>

  <!-- 工具框(虚线容器) -->
  <rect x="160" y="260" width="880" height="230" rx="12" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="190" y="295" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5a6672">Tool calls (ReAct loop · 5-7 rounds per run; the number of rounds is not known in advance)</text>

  <!-- Temporal tool(灰族:CPU) -->
  <rect x="190" y="315" width="250" height="150" rx="10" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.5"/>
  <text x="315" y="352" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5a6672" text-anchor="middle">Temporal tool</text>
  <text x="315" y="378" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">CPU · metadata adapter</text>
  <text x="315" y="400" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">~0.1 ms</text>
  <text x="315" y="430" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8a97a6" text-anchor="middle">(temporal segment retrieval)</text>

  <!-- Spatial tool(蓝族:GPU) -->
  <rect x="475" y="315" width="250" height="150" rx="10" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="600" y="352" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">Spatial tool</text>
  <text x="600" y="378" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">8B VLM / YOLO</text>
  <text x="600" y="400" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">GPU · ~6.4 s</text>
  <text x="600" y="430" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8a97a6" text-anchor="middle">(spatial analysis over frames)</text>

  <!-- Generalist tool(灰族:CPU) -->
  <rect x="760" y="315" width="250" height="150" rx="10" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.5"/>
  <text x="885" y="352" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#5a6672" text-anchor="middle">Generalist tool</text>
  <text x="885" y="378" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">CPU · metadata adapter</text>
  <text x="885" y="400" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">~0.2 s</text>
  <text x="885" y="430" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8a97a6" text-anchor="middle">(general information lookup)</text>

  <!-- 图例 -->
  <rect x="160" y="530" width="16" height="16" rx="3" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="186" y="543" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a6672">GPU stage (vision-language model)</text>
  <rect x="390" y="530" width="16" height="16" rx="3" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.5"/>
  <text x="416" y="543" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5a6672">CPU stage (metadata tool)</text>
  <text x="640" y="543" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6b6b">durations = measured medians (two workflow families: videomme.star / videomme.langgraph_react)</text>
</svg>
