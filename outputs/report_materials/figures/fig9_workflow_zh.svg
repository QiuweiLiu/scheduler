<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <marker id="af" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6672"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="white"/>

  <!-- ===== 主链:输入 → 规划 → 回答 → 答案 ===== -->

  <!-- 输入(灰族:数据) -->
  <rect x="40" y="80" width="200" height="100" rx="10" fill="#f0f2f5" stroke="#8a97a6" stroke-width="2"/>
  <text x="140" y="122" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5a6672" text-anchor="middle">视频 + 问题</text>
  <text x="140" y="148" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">(工作流输入)</text>

  <line x1="240" y1="130" x2="308" y2="130" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>

  <!-- 规划器(蓝族:GPU 模型) -->
  <rect x="310" y="65" width="300" height="130" rx="12" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="2"/>
  <text x="460" y="108" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">规划 Planner</text>
  <text x="460" y="134" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">8B / 4B 视觉语言模型 · GPU</text>
  <text x="460" y="156" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">单步中位时长 ~5.0 s</text>

  <line x1="610" y1="130" x2="678" y2="130" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>

  <!-- 回答生成(蓝族) -->
  <rect x="680" y="65" width="280" height="130" rx="12" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="2"/>
  <text x="820" y="108" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">回答生成</text>
  <text x="820" y="134" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">8B / 3B 视觉语言模型 · GPU</text>
  <text x="820" y="156" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">中位时长 ~0.25 s</text>

  <line x1="960" y1="130" x2="1028" y2="130" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>

  <!-- 答案(灰族) -->
  <rect x="1030" y="80" width="130" height="100" rx="10" fill="#f0f2f5" stroke="#8a97a6" stroke-width="2"/>
  <text x="1095" y="135" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#5a6672" text-anchor="middle">答案</text>

  <!-- ===== ReAct 循环(规划器 ⇄ 工具) ===== -->

  <line x1="420" y1="195" x2="420" y2="258" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>
  <text x="408" y="232" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="end">调用工具</text>

  <line x1="520" y1="258" x2="520" y2="195" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>
  <text x="532" y="232" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="start">观察结果</text>

  <!-- 工具框(虚线容器) -->
  <rect x="160" y="260" width="880" height="230" rx="12" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="190" y="295" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5a6672">工具调用(ReAct 循环 · 每次 5~7 轮,轮数事先未知)</text>

  <!-- 时间工具(灰族:CPU) -->
  <rect x="190" y="315" width="250" height="150" rx="10" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.5"/>
  <text x="315" y="352" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#5a6672" text-anchor="middle">时间工具</text>
  <text x="315" y="378" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">CPU · 元数据适配器</text>
  <text x="315" y="400" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">时长 ~0.1 ms</text>
  <text x="315" y="430" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#8a97a6" text-anchor="middle">(时间片段检索)</text>

  <!-- 空间工具(蓝族:GPU) -->
  <rect x="475" y="315" width="250" height="150" rx="10" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="600" y="352" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">空间工具</text>
  <text x="600" y="378" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">8B 视觉语言模型 / YOLO</text>
  <text x="600" y="400" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">GPU · 时长 ~6.4 s</text>
  <text x="600" y="430" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#8a97a6" text-anchor="middle">(视频帧空间分析)</text>

  <!-- 通用工具(灰族:CPU) -->
  <rect x="760" y="315" width="250" height="150" rx="10" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.5"/>
  <text x="885" y="352" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#5a6672" text-anchor="middle">通用工具</text>
  <text x="885" y="378" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">CPU · 元数据适配器</text>
  <text x="885" y="400" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">时长 ~0.2 s</text>
  <text x="885" y="430" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#8a97a6" text-anchor="middle">(通用信息查询)</text>

  <!-- 图例 -->
  <rect x="160" y="530" width="16" height="16" rx="3" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="186" y="543" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#5a6672">GPU 阶段(视觉语言模型)</text>
  <rect x="390" y="530" width="16" height="16" rx="3" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.5"/>
  <text x="416" y="543" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#5a6672">CPU 阶段(元数据工具)</text>
  <text x="640" y="543" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b6b6b">时长 = 实际运行中位数(两种工作流族:videomme.star / videomme.langgraph_react)</text>
</svg>
