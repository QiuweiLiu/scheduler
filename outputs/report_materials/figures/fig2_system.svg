<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="660" viewBox="0 0 1640 660">
  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b5d8a"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1640" height="660" fill="white"/>

  <!-- ===== main flow (center y = 220) ===== -->

  <rect x="30" y="170" width="180" height="100" rx="10" fill="#dfe6ee" stroke="#2b5d8a" stroke-width="2"/>
  <text x="120" y="212" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">History</text>
  <text x="120" y="238" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">(executed prefix)</text>

  <line x1="210" y1="220" x2="248" y2="220" stroke="#2b5d8a" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="250" y="160" width="200" height="120" rx="12" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="2"/>
  <text x="350" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">GRU predictor</text>
  <text x="350" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">causal GRU &#183; per-instance</text>
  <text x="350" y="254" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">predicts &#8804;5 steps ahead</text>

  <line x1="450" y1="220" x2="488" y2="220" stroke="#6b6b6b" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="490" y="145" width="310" height="150" rx="12" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="1.8"/>
  <text x="645" y="180" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">Prediction outputs</text>
  <text x="515" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">T: per-step runtime quantiles</text>
  <text x="515" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">P(M): next-model distribution</text>
  <text x="515" y="268" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#333333">P(L): remaining-length distribution</text>

  <line x1="800" y1="220" x2="838" y2="220" stroke="#6b6b6b" stroke-width="2" marker-end="url(#ag)"/>

  <rect x="840" y="125" width="280" height="190" rx="12" fill="white" stroke="#2b5d8a" stroke-width="2.2"/>
  <text x="980" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">Scheduler</text>
  <rect x="860" y="175" width="240" height="60" rx="8" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="980" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">Ordering</text>
  <text x="980" y="221" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">which ready task runs first</text>
  <rect x="860" y="245" width="240" height="60" rx="8" fill="#fff7e8" stroke="#c98a2e" stroke-width="1.5"/>
  <text x="980" y="270" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#c98a2e" text-anchor="middle">Residency control</text>
  <text x="980" y="291" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">which models stay in GPU memory</text>

  <line x1="1120" y1="220" x2="1148" y2="220" stroke="#2b5d8a" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="1150" y="165" width="200" height="110" rx="10" fill="#fff7e8" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="1250" y="196" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#c98a2e" text-anchor="middle">Scheduling actions</text>
  <text x="1170" y="222" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#333333">dispatch: run a task</text>
  <text x="1170" y="242" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#333333">keep / evict: model residency</text>
  <text x="1170" y="262" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#333333">prefetch: load ahead</text>

  <line x1="1350" y1="220" x2="1378" y2="220" stroke="#2b5d8a" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="1380" y="160" width="230" height="120" rx="12" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="2"/>
  <text x="1495" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">Executor</text>
  <text x="1495" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">two GPUs</text>
  <text x="1495" y="254" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">runs tasks &#183; manages models</text>

  <!-- ===== evaluation (bottom) ===== -->

  <rect x="30" y="400" width="1580" height="200" rx="12" fill="none" stroke="#6b6b6b" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="60" y="437" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6b6b6b">Simulation-based evaluation (environment: accounting &amp; measurement only)</text>
  <text x="1580" y="437" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#b3544a" text-anchor="end">policy never reads these tables</text>

  <text x="60" y="477" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333333">&#183; Measured basis: co-location slowdown, load interference, batching, load / evict costs on real GPUs</text>
  <text x="60" y="507" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333333">&#183; Derived: time and memory costs per configuration, used to account each scheduling action</text>
  <text x="60" y="537" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333333">&#183; Evaluation: frozen confirm300 &#8212; F0 vs five adapted baselines + residency-action ablation</text>
  <text x="60" y="567" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#333333">&#183; Reported metrics: mean / p95 completion &#183; deadline miss &#183; makespan</text>

  <line x1="1495" y1="400" x2="1495" y2="283" stroke="#6b6b6b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="1507" y="345" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="start">accounts costs</text>
</svg>
