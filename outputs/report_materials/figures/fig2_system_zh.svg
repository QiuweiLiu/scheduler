<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <defs>
    <marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b5d8a"/>
    </marker>
    <marker id="a-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b6b6b"/>
    </marker>
    <marker id="a-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="640" fill="white"/>

  <!-- ============ main flow row (center y = 200) ============ -->

  <!-- input: observed prefix -->
  <rect x="40" y="155" width="170" height="90" rx="10" fill="#dfe6ee" stroke="#2b5d8a" stroke-width="2"/>
  <text x="125" y="195" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">已执行前缀</text>
  <text x="125" y="219" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#6b6b6b" text-anchor="middle">运行中的实例</text>

  <line x1="210" y1="200" x2="278" y2="200" stroke="#2b5d8a" stroke-width="2" marker-end="url(#a-blue)"/>

  <!-- predictor -->
  <rect x="280" y="140" width="260" height="120" rx="12" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="2"/>
  <text x="410" y="180" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">冻结预测器</text>
  <text x="410" y="204" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#6b6b6b" text-anchor="middle">逐实例 &#183; &#8804;5 步</text>
  <text x="410" y="228" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#6b6b6b" text-anchor="middle">输出:T &#183; P(M) &#183; P(L)</text>

  <!-- prediction arrow: predictor -> scheduler (direct connection) -->
  <line x1="540" y1="200" x2="648" y2="200" stroke="#6b6b6b" stroke-width="2" marker-end="url(#a-gray)"/>
  <text x="594" y="188" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">预测</text>

  <!-- scheduler -->
  <rect x="650" y="95" width="340" height="250" rx="12" fill="white" stroke="#2b5d8a" stroke-width="2.2"/>
  <text x="820" y="130" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">调度器</text>

  <rect x="675" y="150" width="290" height="62" rx="8" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="820" y="177" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">排序</text>
  <text x="820" y="199" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">当下成本 + 有限未来成本</text>

  <rect x="675" y="224" width="290" height="62" rx="8" fill="#fff7e8" stroke="#c98a2e" stroke-width="1.5"/>
  <text x="820" y="251" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#c98a2e" text-anchor="middle">驻留控制</text>
  <text x="820" y="273" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">保留 &#183; 驱逐 &#183; 预取</text>

  <text x="820" y="318" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">输出:派发 &#183; 保留 &#183; 驱逐 &#183; 预取</text>

  <!-- actions arrow: scheduler -> GPUs -->
  <line x1="990" y1="200" x2="1078" y2="200" stroke="#2b5d8a" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="1034" y="188" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">动作</text>

  <!-- GPU 执行 -->
  <rect x="1080" y="120" width="300" height="170" rx="12" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="2"/>
  <text x="1230" y="155" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#2b5d8a" text-anchor="middle">GPU 执行</text>
  <rect x="1110" y="175" width="240" height="40" rx="8" fill="#dfe6ee" stroke="#2b5d8a" stroke-width="1.2"/>
  <text x="1230" y="200" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" fill="#2b5d8a" text-anchor="middle">GPU 0</text>
  <rect x="1110" y="225" width="240" height="40" rx="8" fill="#dfe6ee" stroke="#2b5d8a" stroke-width="1.2"/>
  <text x="1230" y="250" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" fill="#2b5d8a" text-anchor="middle">GPU 1</text>

  <!-- ============ second scheduler input: observable state ============ -->

  <rect x="650" y="400" width="340" height="70" rx="10" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="820" y="427" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">可观测状态</text>
  <text x="820" y="450" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">就绪队列 &#183; 驻留 &#183; 空闲显存</text>

  <line x1="820" y1="400" x2="820" y2="347" stroke="#2b5d8a" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="832" y="377" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start">状态</text>

  <!-- ============ evaluator / environment (bottom) ============ -->

  <rect x="40" y="520" width="1320" height="100" rx="12" fill="none" stroke="#6b6b6b" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="70" y="552" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#6b6b6b" text-anchor="start">环境(仅评测层)</text>
  <text x="1330" y="552" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b3544a" text-anchor="end">策略不读取</text>

  <rect x="70" y="570" width="100" height="30" rx="6" fill="#dfe6ee"/>
  <text x="120" y="590" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">共置慢化</text>
  <rect x="185" y="570" width="115" height="30" rx="6" fill="#dfe6ee"/>
  <text x="242" y="590" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">加载干扰</text>
  <rect x="315" y="570" width="95" height="30" rx="6" fill="#dfe6ee"/>
  <text x="362" y="590" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">批处理</text>
  <rect x="425" y="570" width="150" height="30" rx="6" fill="#dfe6ee"/>
  <text x="500" y="590" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle">加载 / 驱逐代价</text>

  <!-- dashed arrow: environment -> GPU 执行 only -->
  <line x1="1230" y1="520" x2="1230" y2="293" stroke="#6b6b6b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a-gray)"/>
  <text x="1242" y="405" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="start">计费</text>
</svg>
