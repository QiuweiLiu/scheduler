<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="660" viewBox="0 0 1640 660">
  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b5d8a"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1640" height="660" fill="white"/>

  <!-- ===== main flow (center y = 220) ===== -->

  <!-- 历史信息 -->
  <rect x="30" y="170" width="180" height="100" rx="10" fill="#dfe6ee" stroke="#2b5d8a" stroke-width="2"/>
  <text x="120" y="212" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">历史信息</text>
  <text x="120" y="238" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">(当前实例的已执行前缀)</text>

  <line x1="210" y1="220" x2="248" y2="220" stroke="#2b5d8a" stroke-width="2" marker-end="url(#ab)"/>

  <!-- GRU 预测器 -->
  <rect x="250" y="160" width="200" height="120" rx="12" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="2"/>
  <text x="350" y="205" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">GRU 预测器</text>
  <text x="350" y="232" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">因果 GRU · 逐实例</text>
  <text x="350" y="254" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">预测未来 ≤5 步</text>

  <line x1="450" y1="220" x2="488" y2="220" stroke="#6b6b6b" stroke-width="2" marker-end="url(#ag)"/>

  <!-- 预测输出 -->
  <rect x="490" y="145" width="310" height="150" rx="12" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="1.8"/>
  <text x="645" y="180" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#2b5d8a" text-anchor="middle">预测输出</text>
  <text x="515" y="212" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#333333">T:每步运行时长(分位数)</text>
  <text x="515" y="240" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#333333">P(M):下一步模型分布</text>
  <text x="515" y="268" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#333333">P(L):剩余链长分布</text>

  <line x1="800" y1="220" x2="838" y2="220" stroke="#6b6b6b" stroke-width="2" marker-end="url(#ag)"/>

  <!-- 调度器 -->
  <rect x="840" y="125" width="280" height="190" rx="12" fill="white" stroke="#2b5d8a" stroke-width="2.2"/>
  <text x="980" y="160" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">调度器</text>
  <rect x="860" y="175" width="240" height="60" rx="8" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="980" y="200" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">排序</text>
  <text x="980" y="221" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">决定先执行哪个任务</text>
  <rect x="860" y="245" width="240" height="60" rx="8" fill="#fff7e8" stroke="#c98a2e" stroke-width="1.5"/>
  <text x="980" y="270" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#c98a2e" text-anchor="middle">驻留控制</text>
  <text x="980" y="291" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">决定模型在显存中的去留</text>

  <line x1="1120" y1="220" x2="1148" y2="220" stroke="#2b5d8a" stroke-width="2" marker-end="url(#ab)"/>

  <!-- 调度动作 -->
  <rect x="1150" y="165" width="200" height="110" rx="10" fill="#fff7e8" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="1250" y="196" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#c98a2e" text-anchor="middle">调度动作</text>
  <text x="1170" y="222" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="10.5" fill="#333333">派发:任务上卡执行</text>
  <text x="1170" y="242" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="10.5" fill="#333333">保留 / 驱逐:模型去留</text>
  <text x="1170" y="262" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="10.5" fill="#333333">预取:提前加载模型</text>

  <line x1="1350" y1="220" x2="1378" y2="220" stroke="#2b5d8a" stroke-width="2" marker-end="url(#ab)"/>

  <!-- 执行器 -->
  <rect x="1380" y="160" width="230" height="120" rx="12" fill="#f7f9fb" stroke="#2b5d8a" stroke-width="2"/>
  <text x="1495" y="205" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">执行器</text>
  <text x="1495" y="232" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">两张 GPU</text>
  <text x="1495" y="254" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">执行任务 · 管理模型</text>

  <!-- ===== 仿真评估 (bottom) ===== -->

  <rect x="30" y="400" width="1580" height="200" rx="12" fill="none" stroke="#6b6b6b" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="60" y="437" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6b6b6b">仿真评估(环境层:仅用于结算与测量)</text>
  <text x="1580" y="437" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b3544a" text-anchor="end">调度策略不读取实测表</text>

  <text x="60" y="477" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#333333">· 实测依据:真实 GPU 上的共置慢化、加载干扰、批处理、加载 / 驱逐代价</text>
  <text x="60" y="507" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#333333">· 由此得到:各配置下的时间与显存开销,用于结算每个调度动作的代价</text>
  <text x="60" y="537" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#333333">· 评估内容:在冻结 confirm300 上对比 F0、五条适配基线与驻留动作消融</text>
  <text x="60" y="567" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#333333">· 报告指标:均值 / p95 完成时间 · 违约率 · makespan</text>

  <!-- dashed arrow: evaluator -> executor only -->
  <line x1="1495" y1="400" x2="1495" y2="283" stroke="#6b6b6b" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ag)"/>
  <text x="1507" y="345" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="start">结算开销</text>
</svg>
