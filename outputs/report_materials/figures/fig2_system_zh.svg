<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 1160 900">
  <defs>
    <marker id="af" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6672"/>
    </marker>
    <marker id="ae" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a97a6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="900" fill="white"/>

  <!-- ================= row 1 ================= -->

  <!-- 数据(灰族) -->
  <rect x="70" y="120" width="200" height="110" rx="10" fill="#f0f2f5" stroke="#8a97a6" stroke-width="2"/>
  <text x="170" y="168" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#5a6672" text-anchor="middle">历史信息</text>
  <text x="170" y="194" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">(当前实例的已执行前缀)</text>

  <line x1="270" y1="175" x2="348" y2="175" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>

  <!-- 方法(蓝族) -->
  <rect x="350" y="110" width="240" height="130" rx="12" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="2"/>
  <text x="470" y="160" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">GRU 预测器</text>
  <text x="470" y="187" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">因果 GRU · 逐实例</text>
  <text x="470" y="209" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">预测未来 ≤5 步</text>

  <line x1="590" y1="175" x2="668" y2="175" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>

  <!-- 数据(灰族) -->
  <rect x="670" y="100" width="360" height="150" rx="12" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.8"/>
  <text x="850" y="137" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="16" font-weight="700" fill="#5a6672" text-anchor="middle">预测输出</text>
  <text x="695" y="170" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#333333">T:每步运行时长(分位数)</text>
  <text x="695" y="198" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#333333">P(M):下一步模型分布</text>
  <text x="695" y="226" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#333333">P(L):剩余链长分布</text>

  <line x1="850" y1="250" x2="850" y2="343" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>
  <text x="862" y="300" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="start">预测</text>

  <!-- ================= row 2 ================= -->

  <!-- 方法容器(蓝族) -->
  <rect x="660" y="345" width="380" height="210" rx="12" fill="white" stroke="#2b5d8a" stroke-width="2.2"/>
  <text x="850" y="385" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#2b5d8a" text-anchor="middle">调度器</text>
  <!-- 排序(蓝族) -->
  <rect x="685" y="400" width="330" height="62" rx="8" fill="#f4f9fd" stroke="#2b5d8a" stroke-width="1.5"/>
  <text x="850" y="428" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#2b5d8a" text-anchor="middle">排序</text>
  <text x="850" y="449" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">决定先执行哪个任务</text>
  <!-- 驻留控制(琥珀族 = 新增能力) -->
  <rect x="685" y="475" width="330" height="62" rx="8" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.5"/>
  <text x="850" y="503" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#c98a2e" text-anchor="middle">驻留控制</text>
  <text x="850" y="524" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">决定模型在显存中的去留</text>

  <line x1="660" y1="450" x2="602" y2="450" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>

  <!-- 调度动作(琥珀族) -->
  <rect x="360" y="385" width="240" height="130" rx="10" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="480" y="418" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#c98a2e" text-anchor="middle">调度动作</text>
  <text x="380" y="446" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="10.5" fill="#333333">派发:任务上卡执行</text>
  <text x="380" y="466" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="10.5" fill="#333333">保留 / 驱逐:模型去留</text>
  <text x="380" y="486" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="10.5" fill="#333333">预取:提前加载模型</text>

  <line x1="360" y1="450" x2="312" y2="450" stroke="#5a6672" stroke-width="2" marker-end="url(#af)"/>

  <!-- 执行器(灰族) -->
  <rect x="70" y="385" width="240" height="130" rx="12" fill="#f0f2f5" stroke="#8a97a6" stroke-width="2"/>
  <text x="190" y="428" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#5a6672" text-anchor="middle">执行器</text>
  <text x="190" y="455" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">两张 GPU</text>
  <text x="190" y="477" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">执行任务 · 管理模型</text>

  <!-- ================= 仿真评估(灰族,虚线) ================= -->

  <rect x="70" y="620" width="1020" height="240" rx="12" fill="none" stroke="#8a97a6" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="100" y="658" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5a6672">仿真评估(环境层:仅用于结算与测量)</text>
  <text x="1060" y="658" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#b3544a" text-anchor="end">调度策略不读取实测表</text>

  <text x="100" y="700" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#333333">· 实测依据:真实 GPU 上的共置慢化、加载干扰、批处理、加载 / 驱逐代价</text>
  <text x="100" y="730" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#333333">· 由此得到:各配置下的时间与显存开销,用于结算每个调度动作的代价</text>
  <text x="100" y="760" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#333333">· 评估内容:在冻结 confirm300 上对比 F0、五条适配基线与驻留动作消融</text>
  <text x="100" y="790" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#333333">· 报告指标:均值 / p95 完成时间 · 违约率 · makespan</text>

  <line x1="190" y1="620" x2="190" y2="517" stroke="#8a97a6" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ae)"/>
  <text x="202" y="572" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="start">结算开销</text>
</svg>
