<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560">
  <defs>
    <marker id="af" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6672"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="560" fill="white"/>

  <!-- ================= ① Normal execution ================= -->

  <text x="40" y="115" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#2b5d8a">① Normal execution</text>
  <text x="40" y="137" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b">(the video agent's ReAct loop)</text>

  <rect x="250" y="75" width="130" height="70" rx="9" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6"/>
  <text x="315" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5a6672" text-anchor="middle">J1 arrives</text>

  <line x1="380" y1="110" x2="416" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="420" y="75" width="140" height="70" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="490" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">Plan 8B</text>

  <line x1="560" y1="110" x2="596" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="600" y="75" width="160" height="70" rx="9" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.6"/>
  <text x="680" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2f8f83" text-anchor="middle">Spatial tool 8B</text>

  <line x1="760" y1="110" x2="796" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="800" y="75" width="140" height="70" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="870" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">Plan 8B</text>

  <line x1="940" y1="110" x2="976" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="980" y="75" width="280" height="70" rx="9" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6"/>
  <text x="1120" y="105" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5a6672" text-anchor="middle">… 5-7 rounds, then answer</text>
  <text x="1120" y="128" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">(rounds not known in advance)</text>

  <!-- ================= ② Capacity pressure ================= -->

  <text x="40" y="275" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#c98a2e">② Multiple arrivals</text>
  <text x="40" y="297" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b">(capacity pressure → residency decision)</text>

  <rect x="250" y="235" width="130" height="70" rx="9" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6"/>
  <text x="315" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#5a6672" text-anchor="middle">J4 arrives</text>

  <line x1="380" y1="270" x2="416" y2="270" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="420" y="235" width="150" height="70" rx="9" fill="#fdecea" stroke="#b3544a" stroke-width="1.6"/>
  <text x="495" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b3544a" text-anchor="middle">Memory pressure</text>

  <line x1="570" y1="270" x2="606" y2="270" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="610" y="235" width="150" height="70" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="685" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#c98a2e" text-anchor="middle">Evict 8B</text>
  <text x="685" y="288" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(scheduling action)</text>

  <line x1="760" y1="270" x2="796" y2="270" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="800" y="235" width="190" height="70" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="895" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#c98a2e" text-anchor="middle">Load 4B</text>
  <text x="895" y="288" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(wait 4.0 s)</text>

  <line x1="990" y1="270" x2="1026" y2="270" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="1030" y="235" width="140" height="70" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="1100" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">Plan 4B</text>

  <!-- ================= ③ 预测预取 ================= -->

  <text x="40" y="435" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#c98a2e">③ Idle window</text>
  <text x="40" y="457" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#6b6b6b">(prediction-driven → prefetch early)</text>

  <rect x="250" y="395" width="230" height="70" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="365" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">Prediction: next step = 3B</text>
  <text x="365" y="448" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(from the GRU predictor)</text>

  <line x1="480" y1="430" x2="516" y2="430" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="520" y="395" width="190" height="70" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="615" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#c98a2e" text-anchor="middle">Prefetch 3B</text>
  <text x="615" y="448" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(loaded 3.9 s ahead)</text>

  <line x1="710" y1="430" x2="746" y2="430" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="750" y="395" width="230" height="70" rx="9" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.6"/>
  <text x="865" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2f8f83" text-anchor="middle">Spatial tool 3B</text>
  <text x="865" y="448" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(no wait at use time)</text>

  <!-- 图例 -->
  <rect x="40" y="512" width="14" height="14" rx="3" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.4"/>
  <text x="62" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5a6672">Plan / prediction</text>
  <rect x="170" y="512" width="14" height="14" rx="3" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.4"/>
  <text x="192" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5a6672">Tool execution</text>
  <rect x="290" y="512" width="14" height="14" rx="3" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.4"/>
  <text x="312" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5a6672">Scheduling actions (evict / load / prefetch)</text>
  <rect x="540" y="512" width="14" height="14" rx="3" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.4"/>
  <text x="562" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5a6672">Job arrival</text>
  <rect x="660" y="512" width="14" height="14" rx="3" fill="#fdecea" stroke="#b3544a" stroke-width="1.4"/>
  <text x="682" y="524" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#5a6672">Capacity pressure</text>
</svg>
