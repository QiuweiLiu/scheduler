  <text x="685" y="288" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(调度动作)</text>

  <line x1="760" y1="270" x2="796" y2="270" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="800" y="235" width="190" height="70" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="895" y="266" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#c98a2e" text-anchor="middle">加载 4B</text>
  <text x="895" y="288" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(等待 4.0 s)</text>

  <line x1="990" y1="270" x2="1026" y2="270" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="1030" y="235" width="140" height="70" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="1100" y="277" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">规划 4B</text>

  <!-- ================= ③ 预测预取 ================= -->

  <text x="40" y="435" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#c98a2e">③ 空闲窗口</text>
  <text x="40" y="457" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b">(预测驱动 → 提前预取)</text>

  <rect x="250" y="395" width="230" height="70" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="365" y="426" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">预测:下一步用 3B</text>
  <text x="365" y="448" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(来自 GRU 预测器)</text>

  <line x1="480" y1="430" x2="516" y2="430" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="520" y="395" width="190" height="70" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="615" y="426" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#c98a2e" text-anchor="middle">预取 3B</text>
  <text x="615" y="448" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(提前装载 3.9 s)</text>

  <line x1="710" y1="430" x2="746" y2="430" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="750" y="395" width="230" height="70" rx="9" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.6"/>
  <text x="865" y="426" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f8f83" text-anchor="middle">空间工具 3B</text>
  <text x="865" y="448" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(使用时零等待)</text>

  <!-- 图例 -->
  <rect x="40" y="512" width="14" height="14" rx="3" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.4"/>
  <text x="62" y="524" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#5a6672">规划 / 预测</text>
  <rect x="170" y="512" width="14" height="14" rx="3" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.4"/>
  <text x="192" y="524" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#5a6672">工具执行</text>
  <rect x="290" y="512" width="14" height="14" rx="3" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.4"/>
  <text x="312" y="524" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#5a6672">调度动作(驱逐 / 加载 / 预取)</text>
  <rect x="540" y="512" width="14" height="14" rx="3" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.4"/>
  <text x="562" y="524" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#5a6672">任务到达</text>
  <rect x="660" y="512" width="14" height="14" rx="3" fill="#fdecea" stroke="#b3544a" stroke-width="1.4"/>
  <text x="682" y="524" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#5a6672">容量压力</text>
</svg>
