<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560">
  <defs>
    <marker id="af" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6672"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="560" fill="white"/>

  <!-- ================= ① 正常执行 ================= -->

  <text x="40" y="115" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#2b5d8a">① 正常执行</text>
  <text x="40" y="137" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b">(视频 Agent 的 ReAct 循环)</text>

  <rect x="250" y="75" width="130" height="70" rx="9" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6"/>
  <text x="315" y="117" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5a6672" text-anchor="middle">J1 到达</text>

  <line x1="380" y1="110" x2="416" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="420" y="75" width="140" height="70" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="490" y="117" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">规划 8B</text>

  <line x1="560" y1="110" x2="596" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="600" y="75" width="160" height="70" rx="9" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.6"/>
  <text x="680" y="117" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f8f83" text-anchor="middle">空间工具 8B</text>

  <line x1="760" y1="110" x2="796" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="800" y="75" width="140" height="70" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="870" y="117" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">规划 8B</text>

  <line x1="940" y1="110" x2="976" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="980" y="75" width="280" height="70" rx="9" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6"/>
  <text x="1120" y="105" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="13" fill="#5a6672" text-anchor="middle">… 循环 5~7 轮,最后回答</text>
  <text x="1120" y="128" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b" text-anchor="middle">(轮数事先未知)</text>

  <!-- ================= ② 容量压力 ================= -->

  <text x="40" y="275" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#c98a2e">② 多任务到达</text>
  <text x="40" y="297" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11.5" fill="#6b6b6b">(容量压力 → 驻留决策)</text>

  <rect x="250" y="235" width="130" height="70" rx="9" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6"/>
  <text x="315" y="277" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5a6672" text-anchor="middle">J4 到达</text>

  <line x1="380" y1="270" x2="416" y2="270" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="420" y="235" width="150" height="70" rx="9" fill="#fdecea" stroke="#b3544a" stroke-width="1.6"/>
  <text x="495" y="277" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#b3544a" text-anchor="middle">显存不足</text>

  <line x1="570" y1="270" x2="606" y2="270" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

