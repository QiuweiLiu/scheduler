<text x="359" y="541" font-family="'Arial','Helvetica Neue'" font-size="12.5" fill="#53616f" text-anchor="start" font-weight="normal">9 fields × 12-d, summed</text>
<text x="359" y="569" font-family="'Arial','Helvetica Neue'" font-size="12.5" fill="#53616f" text-anchor="start" font-weight="normal">+ task-modality one-hot projection</text>
