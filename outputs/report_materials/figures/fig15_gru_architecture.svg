<text x="643" y="343" font-family="'Arial','Helvetica Neue'" font-size="12.5" fill="#53616f" text-anchor="start" font-weight="normal">hidden = 128</text>
<text x="643" y="373" font-family="'Arial','Helvetica Neue'" font-size="12.5" fill="#53616f" text-anchor="start" font-weight="normal">pack_padded · last step h_T</text>
