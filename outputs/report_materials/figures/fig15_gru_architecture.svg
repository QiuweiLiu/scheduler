<text x="359" y="213" font-family="'Arial','Helvetica Neue'" font-size="15" fill="#1f2933" text-anchor="start" font-weight="600">Per-field embedding</text>
<text x="359" y="236" font-family="'Arial','Helvetica Neue'" font-size="12.5" fill="#53616f" text-anchor="start" font-weight="normal">6 fields × 16-d, summed per step</text>
<text x="359" y="259" font-family="'Arial','Helvetica Neue'" font-size="12.5" fill="#53616f" text-anchor="start" font-weight="normal">+ position embedding (≤ 64)</text>
<text x="359" y="282" font-family="'Arial','Helvetica Neue'" font-size="12.5" fill="#53616f" text-anchor="start" font-weight="normal">→ step vectors x_1…x_T</text>
<text x="359" y="305" font-family="'Arial','Helvetica Neue'" font-size="12.5" fill="#53616f" text-anchor="start" font-weight="normal">x [B, ≤64, 16]</text>
