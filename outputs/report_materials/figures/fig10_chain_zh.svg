<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="560" viewBox="0 0 1140 560">
  <defs>
    <marker id="af" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a6672"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="560" fill="white"/>

  <!-- 时间方向 -->
  <text x="55" y="50" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#8a97a6">时间 →</text>
  <text x="55" y="237" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12.5" fill="#8a97a6">时间 →</text>

  <!-- ================= 第一行:J1 到达 → 派发 → 规划 → 空间工具 → J4 到达 ================= -->

  <rect x="143" y="70" width="150" height="80" rx="9" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6"/>
  <text x="218" y="105" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5a6672" text-anchor="middle">J1 到达</text>
  <text x="218" y="127" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(0 s)</text>

  <line x1="293" y1="110" x2="317" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="319" y="70" width="150" height="80" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="394" y="105" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#c98a2e" text-anchor="middle">调度:派发</text>
  <text x="394" y="127" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(启动 J1 执行)</text>

  <line x1="469" y1="110" x2="493" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="495" y="70" width="150" height="80" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="570" y="115" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">规划 8B</text>

  <line x1="645" y1="110" x2="669" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="671" y="70" width="150" height="80" rx="9" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.6"/>
  <text x="746" y="115" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f8f83" text-anchor="middle">空间工具 8B</text>

  <line x1="821" y1="110" x2="845" y2="110" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="847" y="70" width="150" height="80" rx="9" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6"/>
  <text x="922" y="105" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5a6672" text-anchor="middle">J4 到达</text>
  <text x="922" y="127" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(60.5 s)</text>

  <!-- 折返连接 -->
  <polyline points="922,150 922,205 130,205 130,248" fill="none" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>
  <text x="526" y="197" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#8a97a6" text-anchor="middle">时间继续</text>

  <!-- ================= 第二行:驱逐 → 加载 → 规划 → 预取 → 空间工具 → 循环 ================= -->

  <rect x="55" y="250" width="150" height="80" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="130" y="285" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#c98a2e" text-anchor="middle">调度:驱逐 8B</text>
  <text x="130" y="307" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(腾出显存)</text>

  <line x1="205" y1="290" x2="229" y2="290" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="231" y="250" width="150" height="80" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="306" y="285" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#c98a2e" text-anchor="middle">调度:加载 4B</text>
  <text x="306" y="307" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(等待 4.0 s)</text>

  <line x1="381" y1="290" x2="405" y2="290" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="407" y="250" width="150" height="80" rx="9" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.6"/>
  <text x="482" y="295" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#2b5d8a" text-anchor="middle">规划 4B</text>

  <line x1="557" y1="290" x2="581" y2="290" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="583" y="250" width="150" height="80" rx="9" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.8"/>
  <text x="658" y="285" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#c98a2e" text-anchor="middle">调度:预取 3B</text>
  <text x="658" y="307" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(空闲窗口 · 3.9 s)</text>

  <line x1="733" y1="290" x2="757" y2="290" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="759" y="250" width="150" height="80" rx="9" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.6"/>
  <text x="834" y="285" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f8f83" text-anchor="middle">空间工具 3B</text>
  <text x="834" y="307" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(使用时零等待)</text>

  <line x1="909" y1="290" x2="933" y2="290" stroke="#5a6672" stroke-width="1.8" marker-end="url(#af)"/>

  <rect x="935" y="250" width="150" height="80" rx="9" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.6"/>
  <text x="1010" y="285" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="14" font-weight="700" fill="#5a6672" text-anchor="middle">循环 … → 回答</text>
  <text x="1010" y="307" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">(轮数事先未知)</text>

  <!-- ================= 图例 ================= -->

  <rect x="143" y="470" width="14" height="14" rx="3" fill="#f0f2f5" stroke="#8a97a6" stroke-width="1.4"/>
  <text x="165" y="482" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#5a6672">任务到达 / 循环</text>
  <rect x="320" y="470" width="14" height="14" rx="3" fill="#e8f0f7" stroke="#2b5d8a" stroke-width="1.4"/>
  <text x="342" y="482" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#5a6672">Agent 行为:规划</text>
  <rect x="500" y="470" width="14" height="14" rx="3" fill="#e6f3f1" stroke="#2f8f83" stroke-width="1.4"/>
  <text x="522" y="482" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#5a6672">Agent 行为:工具执行</text>
  <rect x="710" y="470" width="14" height="14" rx="3" fill="#fdf3e0" stroke="#c98a2e" stroke-width="1.4"/>
  <text x="732" y="482" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="12" fill="#5a6672">调度器行为(派发 / 驱逐 / 加载 / 预取)</text>

  <text x="143" y="525" font-family="STHeiti, PingFang SC, Arial, sans-serif" font-size="11" fill="#8a97a6">示例来自真实仿真轨迹(validation_000013):J1 于 0 s 到达,J4 于 60.5 s 到达并触发显存压力</text>
</svg>
